<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operator Access — ASTRONET</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: radial-gradient(circle at 50% 20%, #071b2b 0%, #030912 70%);
        }
        .card-glow {
            background: rgba(7, 17, 29, 0.88);
            border: 1px solid rgba(34, 211, 238, 0.25);
            box-shadow: 0 0 35px rgba(6, 182, 212, 0.12);
        }
    </style>
</head>
<body class="min-h-screen text-slate-200 flex items-center justify-center p-4 font-mono">
    <div class="w-full max-w-md rounded-2xl card-glow p-7">
        <div class="flex flex-col items-center text-center mb-6">
            <div class="w-10 h-10 rounded-xl bg-cyan-500/10 border border-cyan-400/30 flex items-center justify-center text-cyan-400 mb-3">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
                </svg>
            </div>
            <h1 class="text-lg font-bold tracking-wider text-cyan-300 uppercase">OPERATOR ACCESS</h1>
            <p class="text-[11px] tracking-widest text-slate-400 uppercase mt-1">ASTRONET // NEO COMMAND TERMINAL</p>
        </div>

        <div id="alertBox" class="hidden mb-4 p-3 rounded-lg text-xs border"></div>

        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block text-[11px] tracking-wider text-cyan-300/90 uppercase mb-1.5">OPERATOR EMAIL</label>
                <input type="email" id="loginEmail" required placeholder="test@example.com"
                    class="w-full px-3.5 py-2.5 rounded-lg bg-[#050d18] border border-cyan-500/30 focus:border-cyan-400 focus:outline-none text-sm text-slate-100 placeholder-slate-500">
            </div>

            <div>
                <label class="block text-[11px] tracking-wider text-cyan-300/90 uppercase mb-1.5">ACCESS PASSCODE</label>
                <input type="password" id="loginPassword" required placeholder="••••••••"
                    class="w-full px-3.5 py-2.5 rounded-lg bg-[#050d18] border border-cyan-500/30 focus:border-cyan-400 focus:outline-none text-sm text-slate-100 placeholder-slate-500">
            </div>

            <div class="flex items-center justify-between text-xs pt-1">
                <label class="inline-flex items-center gap-2 text-slate-300 cursor-pointer select-none">
                    <input type="checkbox" id="rememberSession" checked class="rounded bg-slate-900 border-slate-600 text-cyan-400">
                    <span>Pertahankan Sesi</span>
                </label>
                <a href="./index.html" class="text-cyan-400 hover:underline">← Kembali ke Radar</a>
            </div>

            <button type="submit"
                class="w-full py-2.5 mt-2 rounded-lg bg-cyan-950/70 hover:bg-cyan-900/70 border border-cyan-500/40 text-cyan-300 font-semibold text-xs tracking-widest uppercase transition">
                AUTHENTICATE SESSION
            </button>
        </form>

        <div class="mt-6 pt-4 border-t border-slate-800/80 text-center text-xs text-slate-400">
            Belum memiliki kredensial? <a href="./register.html" class="text-cyan-400 hover:underline font-medium">Daftar Operator Baru</a>
        </div>
    </div>

    <script>
        const USERS_KEY = 'astronet_users_v1';
        const SESSION_KEY = 'astronet_active_operator_v1';

        // Setelah login, kembali ke halaman yang tadi dituju (misalnya archive.html).
        // Hanya archive.html yang diizinkan, selain itu ke index.html.
        function getNextPage() {
            const next = new URLSearchParams(window.location.search).get('next') || '';
            return /^archive\.html(\?[^#]*)?$/.test(next) ? './' + next : './index.html';
        }

        function showAlert(msg, isError = true) {
            const box = document.getElementById('alertBox');
            box.classList.remove('hidden');
            box.className = `mb-4 p-3 rounded-lg text-xs border ${
                isError
                    ? 'bg-rose-500/15 border-rose-500/40 text-rose-300'
                    : 'bg-emerald-500/15 border-emerald-500/40 text-emerald-300'
            }`;
            box.textContent = msg;
        }

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value.trim().toLowerCase();
            const password = document.getElementById('loginPassword').value;

            const users = JSON.parse(localStorage.getItem(USERS_KEY) || '[]');
            const found = users.find(u => u.email === email && u.password === password);

            if (!found) {
                showAlert('Kredensial tidak ditemukan. Klik "Daftar Operator Baru" dulu.');
                return;
            }

            localStorage.setItem(SESSION_KEY, JSON.stringify({ name: found.name, email: found.email }));
            showAlert(`Akses diterima: ${found.name}`, false);
            setTimeout(() => {
                window.location.href = getNextPage();
            }, 600);
        });
    </script>
</body>
</html>
